spring:
  application:
    name: eventrelay
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/outbox}
    username: ${DATABASE_USER:outbox}
    password: ${DATABASE_PASSWORD:outbox}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: payment-projection
      auto-offset-reset: earliest
      enable-auto-commit: false
app:
  kafka:
    topic: payment-events
  outbox:
    batch-size: 50
    max-attempts: 8
    poll-interval: 500ms
    send-timeout: 5s
